<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Audit Trails - PharmaTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .report-tab-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .report-tab-btn:hover {
            background: #e2e8f0;
            color: var(--text-primary);
        }
        .report-tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }
    </style>
</head>
<body>

    <!-- Header Mount -->
    <div id="navbar-mount"></div>

    <!-- Admin Sub-Navigation -->
    <div class="sub-nav">
        <a href="admin-dashboard.html">📊 Overview</a>
        <a href="admin-medicines.html">💊 Medicines & Categories</a>
        <a href="admin-batches.html">📦 Batches & Expiry (FEFO)</a>
        <a href="admin-suppliers.html">🏭 Suppliers & Restocking</a>
        <a href="admin-orders.html">🛍️ Order Fulfillment & Rx</a>
        <a href="admin-reports.html" class="active">📈 Reports & CSV Export</a>
    </div>

    <div class="container">
        
        <div class="page-header">
            <div>
                <h1 class="page-title">Pharmacy Analytics, Reports & Audit Logs</h1>
                <p class="page-subtitle">Generate real-time inventory valuations, expiry risk forecasts, and download CSV reports</p>
            </div>
        </div>

        <!-- Report Tabs -->
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
            <button class="report-tab-btn active" data-tab="inventory" onclick="switchReportTab('inventory')">
                📋 Inventory & Valuation
            </button>
            <button class="report-tab-btn" data-tab="low-stock" onclick="switchReportTab('low-stock')">
                ⚠️ Low-Stock Medicines
            </button>
            <button class="report-tab-btn" data-tab="near-expiry" onclick="switchReportTab('near-expiry')">
                ⏳ Near-Expiry Risk (≤30d)
            </button>
            <button class="report-tab-btn" data-tab="expired" onclick="switchReportTab('expired')">
                ⛔ Expired Batches (Loss)
            </button>
            <button class="report-tab-btn" data-tab="movements" onclick="switchReportTab('movements')">
                📜 Stock Movement Audit
            </button>
        </div>

        <!-- Summary & CSV Export Action Bar -->
        <div class="card" id="report-summary-info" style="margin-bottom: 1.5rem; padding: 1rem 1.5rem;">
            <!-- Rendered by reports.js -->
        </div>

        <!-- Report Table -->
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr id="report-table-headers">
                        <!-- Rendered dynamically -->
                    </tr>
                </thead>
                <tbody id="report-table-body">
                    <!-- Rendered by reports.js -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
